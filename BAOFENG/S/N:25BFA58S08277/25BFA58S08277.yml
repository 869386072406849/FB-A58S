# Abhängigkeitsdiagramm

Du kannst das Abhängigkeitsdiagramm verwenden, um alle Abhängigkeiten deines Projekts zu identifizieren. Das Abhängigkeitsdiagramm unterstützt eine Reihe beliebter Paketökosysteme.

<!--Marketing-LINK: From /features/security and /features/security/software-supply-chain pages "How GitHub's dependency graph is generated".-->

## Informationen zum Abhängigkeitsdiagramm

Das Abhängigkeitsdiagramm ist eine Zusammenfassung von Manifest- und gesperrten Dateien, die in einem Repository gespeichert sind, und aller mithilfe der Abhängigkeitsübermittlungs-API für das Repository übermittelten Abhängigkeiten. Für jedes Repository wird Folgendes angezeigt:

* Abhängigkeiten (die Ökosysteme und Pakete, von denen es abhängig ist)
* Abhängige Elemente (die Repositorys und Pakete, die von ihm abhängig sind)

Für jede Abhängigkeit kannst du die Version, die Lizenzinformationen, die Manifestdatei, die diese enthielt, und die Antwort auf die Frage anzeigen, ob es bekannte Sicherheitsrisiken gibt. Für Paketökosysteme, die transitive Abhängigkeiten unterstützen, wird der Beziehungsstatus angezeigt, und du kannst auf „<svg version="1.1" width="16" height="16" viewBox="0 0 16 16" class="octicon octicon-kebab-horizontal" aria-label="Show dependency options" role="img"><path d="M8 9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3ZM1.5 9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Zm13 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"></path></svg>“ und dann auf „Show paths“ klicken, um den transitiven Pfad anzuzeigen, der die Abhängigkeit eingeführt hat.

Du kannst auch über die Suchleiste nach einer bestimmten Abhängigkeit suchen. Abhängigkeiten werden automatisch so sortiert, dass Sicherheitsrisiken oben stehen.

Weitere Informationen zu den unterstützten Ökosystemen und Manifestdateien finden Sie unter [Von Abhängigkeitsdiagrammen unterstützte Paket-Ökosysteme](/de/code-security/reference/supply-chain-security/dependency-graph-supported-package-ecosystems#supported-package-ecosystems).

Wenn Sie einen Pull Request erstellen, der Änderungen an Abhängigkeiten enthält und auf den Standard-Branch abzielt, verwendet GitHub den Abhängigkeitsgraphen, um dem Pull Request Abhängigkeitsprüfungen hinzuzufügen. Diese geben an, ob die Abhängigkeiten Sicherheitsrisiken enthalten und zeigen ggf. die Version der Abhängigkeit an, in der die Sicherheitsanfälligkeit behoben wurde. Weitere Informationen findest du unter [Abhängigkeitsüberprüfung](/de/code-security/concepts/supply-chain-security/dependency-review).

## Erstellen des Abhängigkeitsdiagramms

Das Abhängigkeitsdiagramm analysiert Abhängigkeiten automatisch, indem Manifeste analysiert und Dateien in Ihrem Repository gesperrt werden. Sie können daten auch selbst übermitteln. Weitere Informationen findest du unter [Wie das Abhängigkeitsdiagramm Abhängigkeiten erkennt](/de/code-security/concepts/supply-chain-security/dependency-graph-data).

## Verfügbarkeit von Abhängigkeitsdiagrammen

Repositoryadmins können das Abhängigkeitsdiagramm für Repositorys aktivieren oder deaktivieren. Weitere Informationen finden Sie unter [Verwalten von Sicherheits- und Analyseeinstellungen für dein Repository](/de/repositories/managing-your-repositorys-settings-and-features/enabling-features-for-your-repository/managing-security-and-analysis-settings-for-your-repository).

Repositoryadmins können das Abhängigkeitsdiagramm für Repositorys aktivieren oder deaktivieren. Siehe [Aktivieren des Abhängigkeitsdiagramms](/de/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/enable-dependency-graph).

## Abhängige Elemente und „Verwendet von“-Daten

Für öffentliche Repositorys listet das Abhängigkeitsdiagramm Abhängigkeiten auf. Dies sind andere öffentliche Repositorys, die vom Repository oder von Paketen abhängen, die es veröffentlicht. Diese Informationen werden für private Repositorys nicht gemeldet.

Einige Repositorys haben einen Abschnitt "Verwendet von" in der Randleiste der Registerkarte **"Code** ". Dieser Abschnitt zeigt die Anzahl der öffentlichen Verweise auf ein gefundenes Paket und zeigt die Avatare einiger Besitzer der abhängigen Projekte an. Wenn Sie auf ein element in diesem Abschnitt klicken, gelangen Sie zur Registerkarte **"Abhängige Elemente" des Abhängigkeitsdiagramms** .

Ihr Repository enthält einen Abschnitt "Verwendet von", wenn:

* Das Abhängigkeitsdiagramm ist für das Repository aktiviert.
* Ihr Repository enthält ein Paket, das in einem unterstützten Paketökosystem veröffentlicht wird. Siehe [Von Abhängigkeitsdiagrammen unterstützte Paket-Ökosysteme](/de/code-security/reference/supply-chain-security/dependency-graph-supported-package-ecosystems#supported-package-ecosystems).
* Innerhalb des Ökosystems verfügt dein Paket über einen Link zu einem *öffentlichen* Repository, in dem die Quelle gespeichert ist.
* Mehr als 100 Repositorys sind von deinem Paket abhängig.

![Ein Screenshot des Abschnitts „Verwendet von“ für ein Repository zeigt die Zusammenfassung von „13.4m“ mit Details zu 8 Avataren und „+13.435.819“.](/assets/images/help/repository/used-by-section.png)

Der Abschnitt „Verwendet von“ stellt ein einzelnes Paket aus dem Repository dar. Wenn du über Administratorberechtigungen für ein Repository verfügst, das mehrere Pakete enthält, kannst du auswählen, welches Paket im Abschnitt „Verwendet von“ angezeigt werden soll. Siehe [Ändern der „Verwendet von“-Daten für ein Repository](/de/code-security/how-tos/view-and-interpret-data/change-used-by-data).

## Was Sie mit dem Abhängigkeitsdiagramm tun können

Du kannst das Abhängigkeitsdiagramm verwenden, um folgende Aktionen auszuführen:

* Erkunden Sie die Repositorys, von
  denen Ihr Code abhängt, und von denen, die davon
  abhängig sind. Weitere Informationen findest du unter [Untersuchen der Abhängigkeiten eines Repositorys](/de/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/explore-dependencies).
* Anzeigen einer Zusammenfassung der in den Repositorys deiner Organisation verwendeten Abhängigkeiten in einem einzelnen Dashboard. Weitere Informationen finden Sie unter [Erkenntnisse zu den Abhängigkeiten in Ihrer Organisation anzeigen](/de/organizations/collaborating-with-groups-in-organizations/viewing-insights-for-dependencies-in-your-organization#viewing-organization-dependency-insights).
* Anzeigen und Aktualisieren von sicherheitsanfälligen Abhängigkeiten für dein Repository. Weitere Informationen findest du unter [Dependabot-Warnungen](/de/code-security/concepts/supply-chain-security/dependabot-alerts).
* Informationen zu sicherheitsanfälligen Abhängigkeiten in Pullanforderungen. Weitere Informationen findest du unter [Überprüfen von Abhängigkeitsänderungen in einem Pull Request](/de/pull-requests/how-tos/review-pull-requests/reviewing-dependency-changes-in-a-pull-request).
* Exportieren Sie eine Software-Stückliste (SBOM) für Audit- oder Compliance-Zwecke. Dies ist ein formaler, maschinenlesbarer Bestand der Abhängigkeiten eines Projekts. Siehe [Exportieren einer Software-Stückliste (Software Bill of Materials, SBOM) für dein Repository](/de/code-security/how-tos/secure-your-supply-chain/establish-provenance-and-integrity/export-dependencies-as-sbom).

## Weiterführende Lektüre

