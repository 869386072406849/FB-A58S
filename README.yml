<!-- oEmbed to iframe -->
<script>
document.querySelectorAll('figure.media oembed').forEach(function(el) {
    var url = el.getAttribute('url') || '';
    var match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&?]+)/);
    if (!match) return;
    var iframe = document.createElement('iframe');
    iframe.src = 'https://www.youtube.com/embed/' + match[1];
    iframe.width = '100%';
    iframe.style.aspectRatio = '16/9';
    iframe.setAttribute('frameborder', '0');
    iframe.setAttribute('allowfullscreen', '');
    el.parentNode.replaceChild(iframe, el);
});
</script>

<!-- Counter -->
<script>
document.querySelectorAll('.js-counter').forEach(function(el) {
    var target = parseFloat(el.innerText.replace(/,/g, ''));
    if (isNaN(target)) return;
    var count = 0;
    var step = Math.ceil(target / 100);
    var timer = setInterval(function() {
        count = Math.min(count + step, target);
        el.innerText = count.toLocaleString();
        if (count >= target) clearInterval(timer);
    }, 20);
});
</script>
